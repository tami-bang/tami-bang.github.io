name: 버그 리포트
description: 재현 가능한 문제를 기록합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 문제 현상
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 확인 환경
      placeholder: "예: Chrome 126 / macOS"
